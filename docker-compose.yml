version: "3.9"

services:
  fastapi:
    build: ./backend
    container_name: smart-alerts-fastapi
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional: enable when scaling to multiple workers or when adding a cache layer
