steps:
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-t", "gcr.io/$PROJECT_ID/smart-alerts-engine", "./backend"]
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/smart-alerts-engine"]
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - smart-alerts-engine
      - --image=gcr.io/$PROJECT_ID/smart-alerts-engine
      - --region=europe-west1
      - --platform=managed
      - --allow-unauthenticated
      - --set-env-vars=APP_ENV=production,DATA_PROVIDER=coingecko,AI_PROVIDER=openai
      - --memory=512Mi
      - --cpu=1
      - --min-instances=1
      - --max-instances=3

options:
  logging: CLOUD_LOGGING_ONLY
